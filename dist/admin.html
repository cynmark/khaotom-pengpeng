<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#991f25">
  <title>เข้าสู่ระบบผู้ดูแล | ข้าวต้มเพ่งเพ้ง</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css?v=5">
  <script src="/supabase-config.js" defer></script>
  <script src="/supabase-client.js" defer></script>
  <script src="/admin-gallery.js?v=5" defer></script>
  <script src="/admin.js?v=5" defer></script>
</head>
<body class="admin-page">
  <main class="admin-card" id="admin-main" aria-busy="true">
    <a class="admin-brand" href="/" aria-label="กลับเว็บไซต์ข้าวต้มเพ่งเพ้ง"><img src="/assets/logo.png" alt="ข้าวต้มเพ่งเพ้ง" width="447" height="447"></a>
    <p class="eyebrow">ADMINISTRATION</p>
    <h1>พื้นที่สำหรับผู้ดูแลร้าน</h1>
    <p class="admin-intro">ข้าวต้มเพ่งเพ้ง · เข้าสู่ระบบสำหรับผู้ดูแลเท่านั้น</p>
    <p id="admin-status" role="status" aria-live="polite">กำลังตรวจสอบการเข้าสู่ระบบ…</p>
    <p id="admin-error" role="alert" hidden></p>
    <form id="admin-login" hidden>
      <fieldset id="login-fields" disabled>
        <label for="admin-email">อีเมล</label>
        <input id="admin-email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
        <label for="admin-password">รหัสผ่าน</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
        <button class="button primary" id="login-button" type="submit">เข้าสู่ระบบ / Login</button>
      </fieldset>
    </form>
    <section id="admin-dashboard" aria-labelledby="dashboard-title" hidden>
      <div class="manager-heading"><h2 id="dashboard-title" tabindex="-1">จัดการเมนูอาหาร</h2><button type="button" id="add-menu" class="button primary">+ เพิ่มเมนูใหม่</button></div>
      <p id="menu-notice" role="status" aria-live="polite"></p>
      <p id="menu-error" role="alert" hidden></p>
      <div class="manager-toolbar"><p id="menu-count"></p><button type="button" id="reload-menu" class="button outline">โหลดรายการอีกครั้ง</button></div>
      <form id="menu-editor" hidden aria-labelledby="editor-title">
        <h3 id="editor-title">เพิ่มเมนูใหม่</h3>
        <fieldset id="menu-fields">
          <div class="editor-grid">
            <label>ชื่อเมนู <span aria-hidden="true">*</span><input id="item-name" name="name" required maxlength="200"></label>
            <label>ราคา (บาท) <span aria-hidden="true">*</span><input id="item-price" name="price" type="number" min="0" step="any" inputmode="decimal" required></label>
            <label class="editor-wide">รายละเอียด<textarea id="item-description" name="description" rows="3"></textarea></label>
            <label>หมวดหมู่<input id="item-category" name="category" list="menu-categories"><datalist id="menu-categories"><option value="ผัด"><option value="ต้ม"><option value="ทอด"><option value="ยำ"><option value="เครื่องดื่ม"></datalist></label>
            <label>ลำดับแสดงผล<input id="item-order" name="display_order" type="number" min="-2147483648" max="2147483647" step="1" value="0" required></label>
            <label class="editor-wide">ลิงก์รูปภาพ<input id="item-image" name="image_url" type="url" placeholder="https://…" aria-describedby="image-help"><small id="image-help">ใส่ลิงก์ http หรือ https หรือเว้นว่างได้</small></label>
          </div>
          <div class="editor-checks"><label><input id="item-recommended" name="is_recommended" type="checkbox"> เมนูแนะนำ</label><label><input id="item-available" name="is_available" type="checkbox" checked> พร้อมจำหน่าย</label></div>
          <div class="editor-actions"><button id="save-menu" type="submit" class="button primary">บันทึกเมนู</button><button id="cancel-edit" type="button" class="button outline">ยกเลิก</button></div>
        </fieldset>
      </form>
      <div id="admin-menu-list" class="admin-menu-list" aria-busy="false"></div>
      <section id="gallery-manager" aria-labelledby="gallery-heading">
        <div class="manager-heading"><h2 id="gallery-heading">จัดการภาพร้าน · Gallery Management</h2><button id="add-gallery" type="button" class="button primary">+ เพิ่มภาพใหม่</button></div>
        <p id="gallery-notice" role="status" aria-live="polite"></p>
        <p id="gallery-error" role="alert" hidden></p>
        <div class="manager-toolbar"><p id="gallery-count"></p><button id="reload-gallery" type="button" class="button outline">โหลดภาพอีกครั้ง</button></div>
        <form id="gallery-editor" aria-labelledby="gallery-editor-title" hidden>
          <h3 id="gallery-editor-title">เพิ่มภาพใหม่</h3>
          <fieldset id="gallery-fields">
            <div class="editor-grid">
              <label>ชื่อภาพ<input id="gallery-title" name="title" maxlength="200"></label>
              <label>ลำดับแสดงผล<input id="gallery-order" name="display_order" type="number" min="-2147483648" max="2147483647" step="1" value="0" required></label>
              <label class="editor-wide">รายละเอียดภาพ<textarea id="gallery-description" name="description" rows="3"></textarea></label>
              <label class="editor-wide">ลิงก์รูปภาพ<input id="gallery-image" name="image_url" type="url" placeholder="https://…" aria-describedby="gallery-image-help"><small id="gallery-image-help">ใส่ลิงก์ http หรือ https หรือเว้นว่างได้</small></label>
            </div>
            <div id="gallery-preview" class="admin-item-image" aria-label="ภาพตัวอย่าง">ไม่มีรูปภาพ</div>
            <div class="editor-checks"><label><input id="gallery-visible" name="is_visible" type="checkbox" checked> แสดงภาพ</label></div>
            <div class="editor-actions"><button id="save-gallery" type="submit" class="button primary">บันทึกภาพ</button><button id="cancel-gallery-edit" type="button" class="button outline">ยกเลิก</button></div>
          </fieldset>
        </form>
        <div id="admin-gallery-list" class="admin-menu-list" aria-busy="false"></div>
      </section>
    </section>
    <div id="session-actions" hidden><button class="button outline" id="logout-button" type="button">ออกจากระบบ / Logout</button></div>
    <button class="button outline" id="retry-button" type="button" hidden>ลองเชื่อมต่ออีกครั้ง</button>
    <a class="admin-back" href="/">กลับหน้าเว็บไซต์</a>
    <noscript><p>กรุณาเปิด JavaScript เพื่อเข้าสู่ระบบผู้ดูแล</p></noscript>
  </main>
  <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
    <h2 id="delete-title">ยืนยันการลบเมนู</h2>
    <p id="delete-description"></p>
    <div class="editor-actions"><button id="cancel-delete" type="button" class="button outline" autofocus>ยกเลิก</button><button id="confirm-delete" type="button" class="button primary">ลบเมนู</button></div>
  </dialog>
  <dialog id="gallery-delete-dialog" aria-labelledby="gallery-delete-title" aria-describedby="gallery-delete-description">
    <h2 id="gallery-delete-title">ยืนยันการลบภาพ</h2>
    <p id="gallery-delete-description"></p>
    <div class="editor-actions"><button id="cancel-gallery-delete" type="button" class="button outline" autofocus>ยกเลิก</button><button id="confirm-gallery-delete" type="button" class="button primary">ลบภาพ</button></div>
  </dialog>
</body>
</html>
